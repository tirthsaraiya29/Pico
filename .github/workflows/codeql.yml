name: "CodeQL Advanced Security Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 4 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: CodeQL Static Analysis
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ea9e4e37999a544e7218766332138100414573c1 # v3.27.4
        with:
          languages: rust, actions
          queries: security-extended,security-and-quality

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@21e7d88c5387417e04f42786c547666da6ce7880 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Build Workspace for CodeQL
        run: |
          cargo check --workspace --all-targets

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ea9e4e37999a544e7218766332138100414573c1 # v3.27.4
        with:
          category: "/language:rust"
