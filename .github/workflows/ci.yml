name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test and Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify Website Sync and Scripts
        shell: bash
        run: |
          cmp -s site/index.html docs/index.html
          if command -v python3 >/dev/null 2>&1; then
            python3 -m py_compile scripts/asr_service.py scripts/whisper_daemon.py scripts/whisper_transcribe.py
          else
            python -m py_compile scripts/asr_service.py scripts/whisper_daemon.py scripts/whisper_transcribe.py
          fi
          if command -v node >/dev/null 2>&1; then
            node --check api/submit.js
          fi

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run All Workspace Tests
        shell: bash
        run: |
          PY=python3
          if ! command -v python3 >/dev/null 2>&1; then PY=python; fi
          "$PY" -c '
          import os, re, subprocess, sys
          proc = subprocess.Popen(
              ["cargo", "test", "--workspace", "--all-features"],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, errors="replace"
          )
          lines = []
          for line in proc.stdout:
              sys.stdout.write(line)
              sys.stdout.flush()
              lines.append(line.rstrip("\r\n"))
          rc = proc.wait()
          if rc != 0:
              bad = [l for l in lines if re.search(r"FAILED|panicked at|assertion|failures:|error(\[|:)", l)]
              tail = bad[:20] if bad else lines[-20:]
              for l in tail:
                  print("::error::" + l[:300])
              if not tail:
                  print("::error::cargo test exited with code " + str(rc))
              sys.exit(rc)
          '

      - name: Build Release
        run: cargo build --workspace --release
