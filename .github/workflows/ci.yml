name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test and Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify Website Sync and Scripts
        shell: bash
        run: |
          cmp -s site/index.html docs/index.html
          if command -v python3 >/dev/null 2>&1; then
            python3 -m py_compile scripts/asr_service.py scripts/whisper_daemon.py scripts/whisper_transcribe.py
          else
            python -m py_compile scripts/asr_service.py scripts/whisper_daemon.py scripts/whisper_transcribe.py
          fi
          if command -v node >/dev/null 2>&1; then
            node --check api/submit.js
          fi

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter
        shell: bash
        run: |
          set -o pipefail
          if ! cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee "$RUNNER_TEMP/clippy_ci.log"; then
            grep -E "error(\[|:)|warning:|-->" "$RUNNER_TEMP/clippy_ci.log" | head -n 30 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Run All Workspace Tests
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --workspace --all-features 2>&1 | tee "$RUNNER_TEMP/test_ci.log"; then
            grep -E "FAILED|panicked at|assertion|error(\[|:)|timed out|Process completed" "$RUNNER_TEMP/test_ci.log" | head -n 30 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Build Release
        run: cargo build --workspace --release
