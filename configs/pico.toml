# Pico System Configuration File
# Non-Generative Probabilistic Decision Intelligence & Continuous Learning
# Cross-platform local execution on Windows 11 and Linux

[decision]
model_version = "pico-decision-v1.0.0"
confidence_threshold = 0.60
max_candidates = 15
enable_cross_encoder = true                 # Enables multi-feature candidate ranking pass
calibration_temperature = 1.0
clarification_margin = 0.08
model_dir = "models/decision"

[learning]
enabled = true
database_path = "data/experiences.sqlite"
auto_train = false
min_observations_for_retraining = 25
max_dataset_entries = 50000
evaluation_heldout_ratio = 0.20
min_promotion_accuracy = 0.85
learning_rate = 0.05

[voice]
vad_threshold = 0.015                       # Energy threshold for voice detection
silence_duration_ms = 600                   # Milliseconds of silence before speech finalization
stt_engine = "auto"                         # Options: "auto" (Parakeet-TDT, Moonshine, Whisper), "parakeet", "moonshine", "whisper", "mock"
tts_engine = "auto"                         # Options: "auto" (Piper -> WinRT/SAPI or eSpeak), "piper", "winrt", "native_sapi", "speech_dispatcher", "espeak", "mock"
speech_rate = 1.0                           # 0.5 to 2.0 playback rate
push_to_talk = false                        # Set true for manual key trigger
ptt_key = "Space"
enable_barge_in = true                      # Interrupt TTS playback when user speech is detected

[audio]
sample_rate = 16000                         # 16kHz standard for speech processing
channels = 1                                # Mono
chunk_size = 512

[security]
policy_mode = "Strict"                      # Options: "Strict", "Permissive"
allowed_directories = ["."]
blocked_directories = [
    "C:\\Windows",
    "C:\\Windows\\System32"
]
require_confirmation_for_shell = true
audit_log_path = "logs/security_audit.jsonl"
command_timeout_seconds = 30

[memory]
database_path = "data/pico_memory.sqlite"
max_history_messages = 50
max_history_tokens = 4096
token_budget = 4096
decay_half_life_days = 14.0

[desktop]
port = 3124
bind_address = "127.0.0.1"
auto_open_browser = true
theme = "dark"
