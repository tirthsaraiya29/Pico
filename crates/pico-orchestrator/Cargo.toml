[package]
name = "pico-orchestrator"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
pico-core = { workspace = true }
pico-platform = { workspace = true }
pico-security = { workspace = true }
pico-inference = { workspace = true }
pico-decision = { workspace = true }
pico-learning = { workspace = true }
pico-tools = { workspace = true }
pico-memory = { workspace = true }
pico-voice = { workspace = true }
pico-audio = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3.13"
